{% extends "popup_handler.html" %}

{% block head %}
<style>
    html, body {
        height: 100%;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .page-wrapper {
        min-height: 100%;
        display: flex;
        flex-direction: column;
    }

    .content {
        flex: 1;
        padding: 40px;
    }

    .footer {
        background: #00bcd4;
        color: white;
        text-align: center;
        padding: 10px 0;
    }
</style>
{% block page_head %}{% endblock %}
{% endblock %}

{% block content %}
<div class="page-wrapper">

    <div class="content">
        {% block page_content %}{% endblock %}
    </div>

    <div class="footer">
        made by Azure | This is a prototype |
        <a href="https://github.com/AzureZerda/CharacterCreator"
           target="_blank"
           rel="noopener noreferrer">
            code
        </a>
    </div>

</div>
{% endblock %}
