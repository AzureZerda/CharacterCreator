<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sheet ID Input</title>
</head>
<body>
    <h1>Enter Sheet ID</h1>

    <form action="/pull_sheet" method="POST">
        <label for="sheet_id">Sheet ID:</label>
        <input type="text" id="sheet_id" name="sheet_id" required>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
